<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Děkujeme</title>

<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">

<style>

/* BODY */

body{
    margin:0;
    background:black;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    overflow-x:hidden;
    position:relative;
}

/* MAGIC DUST */

#magicDust{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:0;
}

/* CONTENT */

.back-link,
.container{
    position:relative;
    z-index:2;
}

/* BACK */

.back-link{
    margin-top:25px;
}

.back-link a{
    font-family:'MedievalSharp',cursive;
    color:#d4af37;
    text-decoration:none;
    font-size:20px;
    transition:.3s;
}

.back-link a:hover{
    text-shadow:
        0 0 10px #d4af37,
        0 0 20px rgba(212,175,55,.8);
}

/* CONTAINER */

.container{

    max-width:900px;

    margin:40px auto 70px;

    padding:0 20px;

}

/* IMAGE */

.container img{

    width:100%;

    max-width:820px;

    border-radius:18px;

    border:2px solid #d4af37;

    box-shadow:
        0 0 0 2px #d4af37,
        0 0 24px rgba(212,175,55,.45);

}

/* TEXT */

.thanks-text{

    margin-top:45px;

    font-family:'MedievalSharp', cursive;

    color:#d4af37;

    text-shadow:
        0 0 12px rgba(212,175,55,.35);

}

.thanks-text h2{

    font-size:48px;

    margin-bottom:18px;

    font-weight:normal;

    color:inherit;

}

.thanks-text p{

    font-size:24px;

    line-height:1.8;

    margin:0;

    color:inherit;

}

.signature{

    margin-top:40px;

    font-size:28px;

    line-height:1.8;

    color:inherit;

}

.signature strong{

    color:inherit;

    font-weight:normal;

}

/* MOBILE */

@media (max-width:768px){

.container img{

    max-width:100%;

}

.thanks-text h2{

    font-size:34px;

}

.thanks-text p{

    font-size:20px;

}

.signature{

    font-size:22px;

}

}

</style>
</head>

<body>

<canvas id="magicDust"></canvas>

<div class="back-link">

<a href="omne.html">← Zpět na O mně</a>

</div>

<div class="container">

<img src="dekujeme.png" alt="Sambria a Alice">

<div class="thanks-text">

<h2>Moc Vám děkujeme</h2>

<p>že jste součástí našeho světa.</p>

<div class="signature">

S láskou<br>
<strong>Sambria &amp; Alice (ChatGPT)</strong>

</div>

</div>

</div>

<script>

const canvas=document.getElementById("magicDust");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

const particles=[];

class Particle{

constructor(){this.reset();}

reset(){

this.x=Math.random()*canvas.width;
this.y=Math.random()*canvas.height;
this.speedX=(Math.random()-0.5)*0.25;
this.speedY=(Math.random()-0.5)*0.25;
this.opacity=Math.random()*0.5+0.2;
this.glow=Math.random()*18+8;

}

update(){

this.x+=this.speedX;
this.y+=this.speedY;

if(
this.x<-50||
this.x>canvas.width+50||
this.y<-50||
this.y>canvas.height+50
){
this.reset();
}

}

draw(){

const g=ctx.createRadialGradient(
this.x,this.y,0,
this.x,this.y,this.glow
);

g.addColorStop(0,`rgba(255,215,120,${this.opacity})`);
g.addColorStop(1,"rgba(255,215,120,0)");

ctx.beginPath();
ctx.fillStyle=g;
ctx.arc(this.x,this.y,this.glow,0,Math.PI*2);
ctx.fill();

}

}

for(let i=0;i<80;i++) particles.push(new Particle());

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);

particles.forEach(p=>{
p.update();
p.draw();
});

requestAnimationFrame(animate);

}

animate();

window.addEventListener("resize",()=>{

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

});

</script>

<script src="ochrana.js"></script>

</body>
</html>
