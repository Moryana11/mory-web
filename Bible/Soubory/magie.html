<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Magie</title>

<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">

<style>

/* BODY */

body{
    margin:0;
    background:black;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    overflow-x:hidden;
}

/* MAGIC DUST */

#magicDust{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:0;
}

/* CONTENT ABOVE EFFECT */

.language-switch,
.back-link,
h1,
.chapter-list{
    position:relative;
    z-index:2;
}

/* LANGUAGE SWITCH */

.language-switch{
    position:fixed;
    top:15px;
    right:15px;
    z-index:999999;
    display:flex;
    gap:12px;
    align-items:center;
}

.language-switch a{
    font-family:'MedievalSharp',cursive;
    text-decoration:none;
    color:#d4af37;
    font-size:22px;
    transition:.3s;
}

.language-switch a:hover{
    text-shadow:
        0 0 10px #d4af37,
        0 0 20px rgba(212,175,55,.8);
}

.language-switch a.active-lang{
    color:white;
    text-shadow:0 0 10px rgba(255,255,255,.7);
}

/* BACK */

.back-link{
    margin-top:25px;
}

.back-link a{
    font-family:'MedievalSharp',cursive;
    color:#d4af37;
    text-decoration:none;
    font-size:20px;
    transition:.3s;
}

.back-link a:hover{
    text-shadow:
        0 0 10px #d4af37,
        0 0 20px rgba(212,175,55,.8);
}

/* TITLE */

h1{
    font-family:'MedievalSharp',cursive;
    color:#d4af37;
    font-size:46px;
    margin-top:15px;
    text-shadow:0 0 12px rgba(212,175,55,.35);
}

/* CONTENT */

.content{
    max-width:1000px;
    margin:45px auto 70px;
    padding:0 30px;
    text-align:left;
    line-height:1.9;
    font-size:20px;
}

.content h2{
    font-family:'MedievalSharp',cursive;
    color:#d4af37;
    font-size:34px;
    margin-top:50px;
    margin-bottom:18px;
}

.content p{
    margin-bottom:22px;
}

.content ul{
    padding-left:30px;
    margin-bottom:28px;
}

.content li{
    margin-bottom:10px;
}

.content strong{
    color:#d4af37;
}

.content a{
    color:#d4af37;
    text-decoration:none;
}

.content a:hover{
    color:white;
    text-shadow:
        0 0 10px #d4af37,
        0 0 20px rgba(212,175,55,.8);
}

/* SECTION TITLE */

.section-title{
    font-family:'MedievalSharp',cursive;
    color:#d4af37;
    font-size:34px;
    text-align:center;
    margin-top:30px;
    margin-bottom:30px;
    text-shadow:0 0 12px rgba(212,175,55,.35);
}

/* LINK BUTTONS */

.chapter-list{
    max-width:650px;
    margin:0 auto 70px;
}

.chapter-list a{
    display:block;
    margin:18px 0;
    padding:18px;
    font-family:'MedievalSharp',cursive;
    font-size:30px;
    color:#d4af37;
    text-decoration:none;
    border:2px solid #d4af37;
    border-radius:12px;
    background:rgba(15,15,15,.9);
    transition:.3s;
}

.chapter-list a:hover{
    background:#d4af37;
    color:black;
    transform:scale(1.03);
    box-shadow:0 0 15px rgba(212,175,55,.8);
}
    
/* MOBILE */

@media (max-width:768px){

h1{
    font-size:36px;
}

.content{
    font-size:18px;
    padding:0 20px;
}

.content h2{
    font-size:28px;
}

.language-switch{
    top:12px;
    right:12px;
}

.language-switch a{
    font-size:20px;
}

.chapter-list{
    width:90%;
}

.chapter-list a{
    font-size:24px;
}

}

</style>
</head>

<body>

<canvas id="magicDust"></canvas>

<div class="language-switch">

<div class="language-switch">
    <a href="magie.html" class="active-lang">CZ</a>
    <a href="magic.html">EN</a>
</div>

<div class="back-link">
    <a href="kniha3.html">← Zpět na Bibli světa</a>
</div>

<h1>Magie</h1>

<div class="chapter-list">

</div>

<script>

const canvas=document.getElementById("magicDust");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

const particles=[];

class Particle{

constructor(){this.reset();}

reset(){

this.x=Math.random()*canvas.width;
this.y=Math.random()*canvas.height;
this.speedX=(Math.random()-0.5)*0.25;
this.speedY=(Math.random()-0.5)*0.25;
this.opacity=Math.random()*0.5+0.2;
this.glow=Math.random()*18+8;

}

update(){

this.x+=this.speedX;
this.y+=this.speedY;

if(this.x<-50||
this.x>canvas.width+50||
this.y<-50||
this.y>canvas.height+50){

this.reset();

}

}

draw(){

const g=ctx.createRadialGradient(
this.x,this.y,0,
this.x,this.y,this.glow);

g.addColorStop(0,`rgba(255,215,120,${this.opacity})`);
g.addColorStop(1,"rgba(255,215,120,0)");

ctx.beginPath();
ctx.fillStyle=g;
ctx.arc(this.x,this.y,this.glow,0,Math.PI*2);
ctx.fill();

}

}

for(let i=0;i<80;i++)particles.push(new Particle());

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);

particles.forEach(p=>{
p.update();
p.draw();
});

requestAnimationFrame(animate);

}

animate();

window.addEventListener("resize",()=>{

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

});

</script>

<script src="../../ochrana.js"></script>

</body>
</html>
