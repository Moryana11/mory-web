<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Magie</title>

<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">

<style>

/* BODY */

body{
    margin:0;
    background:black;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    overflow-x:hidden;
}


/* LANGUAGE SWITCH */

.language-switch{
    position:fixed;
    top:15px;
    right:15px;
    z-index:999999;
    display:flex;
    gap:12px;
    align-items:center;
}

.language-switch a{
    font-family:'MedievalSharp',cursive;
    text-decoration:none;
    color:#d4af37;
    font-size:22px;
    transition:.3s;
}

.language-switch a:hover{
    text-shadow:
        0 0 10px #d4af37,
        0 0 20px rgba(212,175,55,.8);
}

.language-switch a.active-lang{
    color:white;
    text-shadow:0 0 10px rgba(255,255,255,.7);
}

/* BACK */

.back-link{
    margin-top:25px;
}

.back-link a{
    font-family:'MedievalSharp',cursive;
    color:#d4af37;
    text-decoration:none;
    font-size:20px;
    transition:.3s;
}

.back-link a:hover{
    text-shadow:
        0 0 10px #d4af37,
        0 0 20px rgba(212,175,55,.8);
}

/* TITLE */

h1{
    font-family:'MedievalSharp',cursive;
    color:#d4af37;
    font-size:46px;
    margin-top:15px;
    text-shadow:0 0 12px rgba(212,175,55,.35);
}

/* CONTENT */

.content{
    max-width:1000px;
    margin:45px auto 70px;
    padding:0 30px;
    text-align:left;
    line-height:1.9;
    font-size:20px;
}

.content h2{
    font-family:'MedievalSharp',cursive;
    color:#d4af37;
    font-size:34px;
    margin-top:50px;
    margin-bottom:18px;
}

.content p{
    margin-bottom:22px;
}

.content ul{
    padding-left:30px;
    margin-bottom:28px;
}

.content li{
    margin-bottom:10px;
}

.content strong{
    color:#d4af37;
}

.content a{
    color:#d4af37;
    text-decoration:none;
}

.content a:hover{
    color:white;
    text-shadow:
        0 0 10px #d4af37,
        0 0 20px rgba(212,175,55,.8);
}

/* MOBILE */

@media (max-width:768px){

h1{font-size:36px;}

.content{
    font-size:18px;
    padding:0 20px;
}

.content h2{
    font-size:28px;
}

.language-switch{
    top:12px;
    right:12px;
}

.language-switch a{
    font-size:20px;
}

.section-title{
    font-size:28px;
}

.chapter-list{
    width:90%;
}

.chapter-list a{
    font-size:24px;
}

/* SECTION TITLE */

.section-title{
    font-family:'MedievalSharp',cursive;
    color:#d4af37;
    font-size:34px;
    text-align:center;
    margin-top:30px;
    margin-bottom:30px;
    text-shadow:0 0 12px rgba(212,175,55,.35);
}

/* LINK BUTTONS */

.chapter-list{
    max-width:650px;
    margin:0 auto 70px;
}

.chapter-list a{
    display:block;
    margin:18px 0;
    padding:18px;
    font-family:'MedievalSharp',cursive;
    font-size:30px;
    color:#d4af37;
    text-decoration:none;
    border:2px solid #d4af37;
    border-radius:12px;
    background:rgba(15,15,15,.9);
    transition:.3s;
}

.chapter-list a:hover{
    background:#d4af37;
    color:black;
    transform:scale(1.03);
    box-shadow:0 0 15px rgba(212,175,55,.8);
}

</style>
</head>

</div>

</div>

</html>
